name: local-ai-platform

services:
  postgres:
    image: postgres:16
    container_name: lap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_TAG:-main-stable}
    container_name: lap-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY manquant dans .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY manquant dans .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY manquant dans .env}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [backend, frontend]

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_TAG:-main}
    container_name: lap-open-webui
    restart: unless-stopped
    depends_on: [litellm]
    ports:
      - "3000:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY manquant dans .env}
      ENABLE_OLLAMA_API: "False"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${WEBUI_LITELLM_KEY:-}
    volumes:
      - openwebui_data:/app/backend/data
    networks: [frontend]

networks:
  backend:
  frontend:

volumes:
  postgres_data:
  openwebui_data:
